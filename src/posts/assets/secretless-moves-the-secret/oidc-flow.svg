<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.b{fill:#fff;stroke:#1b1b1b;stroke-width:1.5}.x{fill:#fff;stroke:#FF3B14;stroke-width:2}.t{font:600 14px system-ui,sans-serif;fill:#1b1b1b}.s{font:12px system-ui,sans-serif;fill:#555}.m{font:12px system-ui,sans-serif;fill:#1b1b1b}.n{fill:#f4f4f4;stroke:#999;stroke-width:1}.v{stroke:#bbb;stroke-width:1.2;stroke-dasharray:4 4}.l{stroke:#1b1b1b;stroke-width:1.5;fill:none;marker-end:url(#m)}.d{stroke:#1b1b1b;stroke-width:1.5;fill:none;stroke-dasharray:5 3;marker-end:url(#m)}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1b1b1b"/></marker></defs>

<rect class="b" x="30" y="16" width="160" height="56" rx="6"/><text class="t" x="110" y="40" text-anchor="middle">Pipeline job</text><text class="s" x="110" y="58" text-anchor="middle">env: prod</text>
<rect class="b" x="220" y="16" width="160" height="56" rx="6"/><text class="t" x="300" y="40" text-anchor="middle">GitHub OIDC issuer</text><text class="s" x="300" y="58" text-anchor="middle">private key + public JWKS</text>
<rect class="x" x="410" y="16" width="160" height="56" rx="6"/><text class="t" x="490" y="40" text-anchor="middle">Identity provider</text><text class="s" x="490" y="58" text-anchor="middle">trust rule: issuer + subject</text>
<rect class="b" x="600" y="16" width="160" height="56" rx="6"/><text class="t" x="680" y="40" text-anchor="middle">Target platform</text><text class="s" x="680" y="58" text-anchor="middle">service principal</text>

<path class="v" d="M110,72V400"/><path class="v" d="M300,72V400"/><path class="v" d="M490,72V400"/><path class="v" d="M680,72V400"/>

<path class="l" d="M110,110H296"/><text class="m" x="118" y="102">1  request token (per-job credential)</text>
<path class="d" d="M300,150H114"/><text class="m" x="292" y="142" text-anchor="end">2  signed JWT, minutes</text>
<path class="l" d="M110,190H486"/><text class="m" x="118" y="182">3  JWT as client assertion</text>
<path class="l" d="M490,222H304"/><text class="m" x="482" y="216" text-anchor="end">fetch public keys</text>
<rect class="n" x="420" y="236" width="140" height="40" rx="6"/><text class="s" x="490" y="253" text-anchor="middle">check signature,</text><text class="s" x="490" y="268" text-anchor="middle">match the subject</text>
<path class="d" d="M490,300H114"/><text class="m" x="482" y="292" text-anchor="end">4  access token</text>
<path class="l" d="M110,340H676"/><text class="m" x="118" y="332">5  deploy with the access token</text>
<rect class="n" x="610" y="352" width="140" height="40" rx="6"/><text class="s" x="680" y="369" text-anchor="middle">runs as the service</text><text class="s" x="680" y="384" text-anchor="middle">principal, checks ACLs</text>
</svg>
