<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.b{fill:#fff;stroke:#1b1b1b;stroke-width:1.5}.x{fill:none;stroke:#FF3B14;stroke-width:2;stroke-dasharray:6 4}.t{font:600 14px system-ui,sans-serif;fill:#1b1b1b}.s{font:12px system-ui,sans-serif;fill:#555}.h{font:700 15px system-ui,sans-serif;fill:#FF3B14}.r{font:600 12px system-ui,sans-serif;fill:#FF3B14}.l{stroke:#1b1b1b;stroke-width:1.5;fill:none;marker-end:url(#m)}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1b1b1b"/></marker></defs>

<text class="h" x="20" y="24">Before · one secret, many copies</text>
<rect class="b" x="110" y="150" width="140" height="60" rx="6"/><text class="t" x="124" y="176">client_secret</text><text class="s" x="124" y="194">valid for years</text>
<rect class="b" x="20" y="44" width="150" height="48" rx="6"/><text class="s" x="32" y="73">repo secrets</text>
<rect class="b" x="190" y="44" width="150" height="48" rx="6"/><text class="s" x="202" y="73">pipeline variables</text>
<rect class="b" x="20" y="268" width="150" height="48" rx="6"/><text class="s" x="32" y="297">a laptop</text>
<rect class="b" x="190" y="268" width="150" height="48" rx="6"/><text class="s" x="202" y="297">a chat thread</text>
<path class="l" d="M150,150L100,92"/><path class="l" d="M210,150L260,92"/><path class="l" d="M150,210L100,268"/><path class="l" d="M210,210L260,268"/>
<rect class="x" x="10" y="34" width="340" height="292" rx="10"/>
<text class="r" x="20" y="348">Boundary: anyone who can read the string.</text>
<text class="s" x="20" y="366">Blurry, and it grows with every copy.</text>

<path class="l" d="M362,180H398"/><text class="s" x="381" y="168" text-anchor="middle">moves to</text>

<text class="h" x="410" y="24">After · clear trust boundaries</text>
<rect class="x" x="410" y="34" width="380" height="292" rx="10"/>
<rect class="x" x="426" y="70" width="348" height="240" rx="8"/>
<rect class="x" x="442" y="106" width="316" height="188" rx="8"/>
<rect class="x" x="458" y="142" width="284" height="136" rx="8"/>
<text class="t" x="422" y="56">Issuer's signing key</text><text class="s" x="580" y="56">GitHub, cloud, SPIRE CA</text>
<text class="t" x="438" y="92">Who can edit the trust rule</text>
<text class="t" x="454" y="128">The subject in the rule</text><text class="s" x="626" y="128">repo + environment</text>
<text class="t" x="470" y="164">Who can become that subject</text>
<text class="s" x="470" y="184">branch protection, environment</text>
<text class="s" x="470" y="200">approvals, repo admins, socket rights</text>
<rect class="b" x="530" y="216" width="140" height="48" rx="6"/><text class="t" x="544" y="236">Workload</text><text class="s" x="544" y="254">token lives minutes</text>
<text class="r" x="410" y="348">Boundary: four permissions you can name and review.</text>
<text class="s" x="410" y="366">Nothing to copy. Each layer has an owner.</text>
</svg>
