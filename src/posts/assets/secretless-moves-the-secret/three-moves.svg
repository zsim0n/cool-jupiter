<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.b{fill:#fff;stroke:#1b1b1b;stroke-width:1.5}.x{fill:#fff;stroke:#FF3B14;stroke-width:2}.t{font:600 14px system-ui,sans-serif;fill:#1b1b1b}.s{font:12px system-ui,sans-serif;fill:#555}.h{font:700 15px system-ui,sans-serif;fill:#FF3B14}.l{stroke:#1b1b1b;stroke-width:1.5;fill:none;marker-end:url(#m)}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1b1b1b"/></marker></defs>

<text class="h" x="190" y="24">1 · Attest</text><text class="h" x="390" y="24">2 · Issue</text><text class="h" x="590" y="24">3 · Verify</text>

<text class="t" x="20" y="70">GitHub Actions</text>
<rect class="b" x="190" y="36" width="170" height="64" rx="6"/><text class="t" x="202" y="62">GitHub runs the job</text><text class="s" x="202" y="82">per-job request token</text>
<rect class="b" x="390" y="36" width="170" height="64" rx="6"/><text class="t" x="402" y="62">OIDC JWT</text><text class="s" x="402" y="82">minutes, repo + env</text>
<rect class="b" x="590" y="36" width="190" height="64" rx="6"/><text class="t" x="602" y="62">Trust rule match</text><text class="s" x="602" y="82">issuer + subject</text>
<path class="l" d="M360,68H390"/><path class="l" d="M560,68H590"/>

<text class="t" x="20" y="146">Azure managed</text><text class="t" x="20" y="164">identity</text>
<rect class="b" x="190" y="120" width="170" height="64" rx="6"/><text class="t" x="202" y="146">Azure runs the VM</text><text class="s" x="202" y="166">local metadata endpoint</text>
<rect class="b" x="390" y="120" width="170" height="64" rx="6"/><text class="t" x="402" y="146">Entra token</text><text class="s" x="402" y="166">short-lived</text>
<rect class="b" x="590" y="120" width="190" height="64" rx="6"/><text class="t" x="602" y="146">Azure services</text><text class="s" x="602" y="166">trust Entra's public keys</text>
<path class="l" d="M360,152H390"/><path class="l" d="M560,152H590"/>

<text class="t" x="20" y="236">SPIFFE / SPIRE</text>
<rect class="b" x="190" y="204" width="170" height="64" rx="6"/><text class="t" x="202" y="230">Agent checks caller</text><text class="s" x="202" y="250">kernel, cgroup, TPM</text>
<rect class="b" x="390" y="204" width="170" height="64" rx="6"/><text class="t" x="402" y="230">SVID</text><text class="s" x="402" y="250">X.509 or JWT, ~1 h</text>
<rect class="b" x="590" y="204" width="190" height="64" rx="6"/><text class="t" x="602" y="230">Any verifier</text><text class="s" x="602" y="250">trusting SPIRE's JWKS</text>
<path class="l" d="M360,236H390"/><path class="l" d="M560,236H590"/>

<path class="l" d="M685,268V300"/>
<rect class="x" x="190" y="300" width="590" height="72" rx="6"/><text class="t" x="204" y="326">What is left to protect</text><text class="s" x="204" y="346">the issuer's signing key, the subject in each trust rule,</text><text class="s" x="204" y="362">and who can make the platform vouch for them</text>
</svg>
