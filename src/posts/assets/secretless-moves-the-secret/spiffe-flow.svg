<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.b{fill:#fff;stroke:#1b1b1b;stroke-width:1.5}.x{fill:#fff;stroke:#FF3B14;stroke-width:2}.t{font:600 14px system-ui,sans-serif;fill:#1b1b1b}.s{font:12px system-ui,sans-serif;fill:#555}.m{font:12px system-ui,sans-serif;fill:#1b1b1b}.h{font:700 13px system-ui,sans-serif;fill:#FF3B14}.n{fill:#f4f4f4;stroke:#999;stroke-width:1}.v{stroke:#bbb;stroke-width:1.2;stroke-dasharray:4 4}.l{stroke:#1b1b1b;stroke-width:1.5;fill:none;marker-end:url(#m)}.d{stroke:#1b1b1b;stroke-width:1.5;fill:none;stroke-dasharray:5 3;marker-end:url(#m)}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1b1b1b"/></marker></defs>

<rect class="b" x="14" y="16" width="140" height="56" rx="6"/><text class="t" x="84" y="40" text-anchor="middle">Workload</text><text class="s" x="84" y="58" text-anchor="middle">any host or K8s</text>
<rect class="x" x="170" y="16" width="140" height="56" rx="6"/><text class="t" x="240" y="40" text-anchor="middle">SPIRE agent</text><text class="s" x="240" y="58" text-anchor="middle">on each node</text>
<rect class="b" x="326" y="16" width="140" height="56" rx="6"/><text class="t" x="396" y="40" text-anchor="middle">SPIRE server</text><text class="s" x="396" y="58" text-anchor="middle">CA + public JWKS</text>
<rect class="b" x="482" y="16" width="140" height="56" rx="6"/><text class="t" x="552" y="40" text-anchor="middle">Identity provider</text><text class="s" x="552" y="58" text-anchor="middle">trust rule</text>
<rect class="b" x="638" y="16" width="140" height="56" rx="6"/><text class="t" x="708" y="40" text-anchor="middle">Target platform</text><text class="s" x="708" y="58" text-anchor="middle">service principal</text>

<path class="v" d="M84,72V456"/><path class="v" d="M240,72V456"/><path class="v" d="M396,72V456"/><path class="v" d="M552,72V456"/><path class="v" d="M708,72V456"/>

<text class="h" x="14" y="96">Once per node</text>
<path class="l" d="M240,118H392"/><text class="m" x="248" y="110">0  TPM attestation</text>

<text class="h" x="14" y="144">Per workload, renewed before expiry</text>
<path class="l" d="M84,176H236"/><text class="m" x="92" y="170">1  who am I?</text>
<rect class="n" x="174" y="184" width="132" height="40" rx="6"/><text class="s" x="240" y="201" text-anchor="middle">kernel check: UID,</text><text class="s" x="240" y="216" text-anchor="middle">cgroup, pod, image</text>
<path class="l" d="M240,240H392"/><text class="m" x="248" y="232">2  mint SVID</text>
<path class="d" d="M240,268H88"/><text class="m" x="232" y="262" text-anchor="end">3  JWT-SVID, ~1 h</text>

<text class="h" x="14" y="292">Exchange, same as the GitHub flow</text>
<path class="l" d="M84,324H548"/><text class="m" x="92" y="318">4  SVID as client assertion</text>
<path class="l" d="M552,348H400"/><text class="m" x="544" y="342" text-anchor="end">fetch public keys</text>
<path class="d" d="M552,380H88"/><text class="m" x="544" y="374" text-anchor="end">5  access token</text>
<path class="l" d="M84,412H704"/><text class="m" x="92" y="404">6  call with the access token</text>
<rect class="n" x="642" y="420" width="132" height="36" rx="6"/><text class="s" x="708" y="442" text-anchor="middle">runs as the SP</text>
</svg>
