<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 404" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.b{fill:#fff;stroke:#1b1b1b;stroke-width:1.5}.x{fill:#fff;stroke:#FF3B14;stroke-width:2}.d{fill:#fff;stroke:#FF3B14;stroke-width:1.5;stroke-dasharray:5 4}.t{font:600 14px system-ui,sans-serif;fill:#1b1b1b}.s{font:12px system-ui,sans-serif;fill:#555}.p{font:600 11px system-ui,sans-serif;fill:#FF3B14}.h{font:700 15px system-ui,sans-serif;fill:#FF3B14}.l{stroke:#1b1b1b;stroke-width:1.5;fill:none;marker-end:url(#m)}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1b1b1b"/></marker></defs>

<text class="h" x="20" y="22">Teams</text>
<rect class="b" x="20" y="32" width="230" height="78" rx="6"/><text class="t" x="34" y="58">npm builds</text><text class="s" x="34" y="78">picks · upgrade timing</text><rect class="d" x="156" y="86" width="82" height="18" rx="4"/><text class="p" x="167" y="99">own policy</text>
<rect class="b" x="285" y="32" width="230" height="78" rx="6"/><text class="t" x="299" y="58">Python builds</text><text class="s" x="299" y="78">picks · upgrade timing</text><rect class="d" x="421" y="86" width="82" height="18" rx="4"/><text class="p" x="432" y="99">own policy</text>
<rect class="b" x="550" y="32" width="230" height="78" rx="6"/><text class="t" x="564" y="58">Java builds</text><text class="s" x="564" y="78">picks · upgrade timing</text><rect class="d" x="686" y="86" width="82" height="18" rx="4"/><text class="p" x="697" y="99">own policy</text>

<path class="l" d="M200,110V158"/><path class="l" d="M385,110V158"/><path class="l" d="M650,110V158"/>

<text class="h" x="20" y="150">Shared core: proxy repository</text>
