<rect class="b" x="285" y="310" width="230" height="50" rx="6"/><text class="t" x="299" y="340">PyPI</text>
<rect class="b" x="550" y="310" width="230" height="50" rx="6"/><text class="t" x="564" y="340">Maven Central</text>

<text class="s" x="20" y="390">Every build resolves packages through the proxy. Teams set their own policy, such as Renovate’s minimumReleaseAge.</text>
