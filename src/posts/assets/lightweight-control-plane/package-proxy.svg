<rect class="b" x="332" y="180" width="136" height="62" rx="6"/><text class="t" x="344" y="206">Download log</text><text class="s" x="344" y="226">per build · team</text>
<rect class="b" x="480" y="180" width="136" height="62" rx="6"/><text class="t" x="492" y="206">SBOMs</text><text class="s" x="492" y="226">from deployed</text>
