<rect class="b" x="20" y="40" width="160" height="60" rx="6"/><text class="t" x="34" y="65">Client</text><text class="s" x="34" y="85">POST /orders + key</text>
<rect class="b" x="220" y="40" width="140" height="60" rx="6"/><text class="t" x="234" y="65">API gateway</text><text class="s" x="234" y="85">auth · limits · trace</text>
