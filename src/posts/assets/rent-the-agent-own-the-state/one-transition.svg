<rect class="x" x="200" y="224" width="580" height="40" rx="6"/><text class="t" x="214" y="249">Process state · one transition log</text>
<text class="s k" x="250" y="290">day 1</text><text class="s k" x="370" y="290">day 1</text><text class="s k" x="490" y="290">day 3</text><text class="s k" x="610" y="290">week 4</text><text class="s k" x="730" y="290">week 6</text>
