<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330"><style>.bg{fill:#fafafa}.b{fill:#fff;stroke:#1b1b1b;stroke-width:1.5}.x{fill:#fff;stroke:#FF3B14;stroke-width:2}.d{fill:#fff;stroke:#FF3B14;stroke-width:1.5;stroke-dasharray:5 4}.t{font:600 14px system-ui,sans-serif;fill:#1b1b1b}.s{font:12px system-ui,sans-serif;fill:#555}.h{font:700 15px system-ui,sans-serif;fill:#FF3B14}.l{stroke:#1b1b1b;stroke-width:1.5;fill:none;marker-end:url(#m)}.ld{stroke:#999;stroke-width:1.2;fill:none;stroke-dasharray:4 4}.lx{stroke:#FF3B14;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#mx)}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1b1b1b"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#FF3B14"/></marker></defs>
<rect class="bg" width="800" height="330"/>
<rect class="b" x="20" y="120" width="130" height="70" rx="6"/><text class="t" x="34" y="148">Your agent</text><text class="s" x="34" y="168">identity · goal</text>
<rect class="x" x="190" y="30" width="170" height="250" rx="6"/><text class="t" x="204" y="56">Gateway</text><text class="s" x="204" y="76">identity &amp; policy</text><text class="s" x="204" y="94">routing · audit · cost</text>
<rect class="d" x="204" y="200" width="142" height="62" rx="6"/><text class="t" x="216" y="225">Registry</text><text class="s" x="216" y="245">APIs · MCP · agents</text>
<path class="l" d="M150,155H188"/>
<text class="h" x="400" y="50">MCP: agent to tools</text>
<rect class="b" x="400" y="65" width="150" height="56" rx="6"/><text class="t" x="414" y="89">MCP server</text><text class="s" x="414" y="108">a façade, an adapter</text>
<rect class="b" x="590" y="65" width="190" height="56" rx="6"/><text class="t" x="604" y="89">Existing APIs</text><text class="s" x="604" y="108">REST · gRPC · workflows</text>
<path class="l" d="M360,93H398"/><path class="l" d="M550,93H588"/>
<text class="h" x="400" y="170">A2A: agent to agent</text>
<rect class="b" x="400" y="185" width="150" height="56" rx="6"/><text class="t" x="414" y="209">Other agent</text><text class="s" x="414" y="228">Agent Card</text>
<rect class="b" x="590" y="185" width="190" height="56" rx="6"/><text class="t" x="604" y="209">Its own tools</text><text class="s" x="604" y="228">via its own MCP</text>
<path class="l" d="M360,213H398"/><path class="l" d="M550,213H588"/>
<text class="s" x="400" y="290">MCP Tasks and A2A both handle long-running work,</text><text class="s" x="400" y="307">so the two lanes are starting to overlap.</text>
</svg>
