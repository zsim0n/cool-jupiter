<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200"><style>.bg{fill:#fafafa}.b{fill:#fff;stroke:#1b1b1b;stroke-width:1.5}.x{fill:#fff;stroke:#FF3B14;stroke-width:2}.d{fill:#fff;stroke:#FF3B14;stroke-width:1.5;stroke-dasharray:5 4}.t{font:600 14px system-ui,sans-serif;fill:#1b1b1b}.s{font:12px system-ui,sans-serif;fill:#555}.h{font:700 15px system-ui,sans-serif;fill:#FF3B14}.l{stroke:#1b1b1b;stroke-width:1.5;fill:none;marker-end:url(#m)}.ld{stroke:#999;stroke-width:1.2;fill:none;stroke-dasharray:4 4}.lx{stroke:#FF3B14;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#mx)}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1b1b1b"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#FF3B14"/></marker></defs>
<rect class="bg" width="800" height="200"/>
<rect class="b" x="15" y="40" width="175" height="110" rx="6"/><text class="t" x="27" y="65">1. Online</text><text class="s" x="27" y="88">evt_101 arrives by push</text><text class="s" x="27" y="106">cursor = 101</text>
<rect class="d" x="215" y="40" width="175" height="110" rx="6"/><text class="t" x="227" y="65">2. Laptop closed</text><text class="s" x="227" y="88">pushes for 102–105 fail</text><text class="s" x="227" y="106">nothing is lost, it's</text><text class="s" x="227" y="122">all still in the log</text>
<rect class="b" x="415" y="40" width="175" height="110" rx="6"/><text class="t" x="427" y="65">3. Laptop opens</text><text class="s" x="427" y="88">GET /events</text><text class="s" x="427" y="106">?after=101</text>
<rect class="x" x="615" y="40" width="170" height="110" rx="6"/><text class="t" x="627" y="65">4. Caught up</text><text class="s" x="627" y="88">102–105, in order</text><text class="s" x="627" y="106">cursor = 105</text><text class="s" x="627" y="122">no retry storm</text>
<path class="l" d="M190,95H213"/><path class="l" d="M390,95H413"/><path class="l" d="M590,95H613"/>
<text class="s" x="15" y="180">Push and pull share the same event IDs and ordering, so the cursor works for both.</text>
</svg>
